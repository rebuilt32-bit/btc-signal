<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BTC Signal — Closing Gap</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; padding: 12px; max-width: 700px; margin: 0 auto; font-family: -apple-system, system-ui, sans-serif; background: #0d1117; color: #e6edf3; font-size: 14px; }
h1 { font-size: 20px; margin: 0 0 12px; }
h2 { font-size: 16px; margin: 20px 0 8px; }
#countdown { font-size: 18px; font-weight: 600; padding: 12px; background: #161b22; border-radius: 8px; border-left: 3px solid #58a6ff; margin-bottom: 16px; }
#countdown.in-window { border-left-color: #f85149; color: #ff7b72; animation: pulse 1.5s infinite; }
@keyframes pulse { 50% { opacity: 0.65; } }
.muted { color: #8b949e; padding: 8px; }
.call { background: #161b22; border-radius: 8px; padding: 10px; margin-bottom: 8px; border-left: 3px solid #58a6ff; }
.call.extreme { border-left-color: #3fb950; }
.call.exceptional { border-left-color: #56d364; }
.call.very_high { border-left-color: #79c0ff; }
.call.high { border-left-color: #58a6ff; }
.call.moderate { border-left-color: #d29922; }
.call.narrow { border-left-color: #f0883e; }
.call.coinflip { border-left-color: #f85149; }
.call.losing_side { border-left-color: #ff7b72; opacity: 0.6; }
.call-header { display: flex; gap: 10px; align-items: center; margin-bottom: 6px; font-weight: 600; }
.call-header .asset { color: #58a6ff; font-size: 15px; }
.call-header .time-left { color: #8b949e; font-size: 13px; font-weight: 400; margin-left: auto; }
.bucket-tag { font-size: 11px; padding: 2px 6px; border-radius: 4px; background: #21262d; color: #8b949e; }
.call-body, .call-prices { display: flex; gap: 12px; flex-wrap: wrap; color: #8b949e; font-size: 13px; }
.call-prices { margin-top: 4px; color: #e6edf3; font-weight: 500; }
.freshness { font-size: 12px; padding: 2px 6px; border-radius: 4px; margin-left: 8px; font-weight: 400; }
.freshness.fresh { background: #033a16; color: #3fb950; }
.freshness.aging { background: #3a2e00; color: #d29922; }
.freshness.stale { background: #4a1f00; color: #f0883e; }
.freshness.old { background: #4a0d10; color: #f85149; }
#asset-toggle { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
#asset-toggle button { background: #161b22; border: 1px solid #30363d; color: #e6edf3; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; }
#asset-toggle button.active { background: #1f6feb; border-color: #1f6feb; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { padding: 6px 8px; text-align: left; border-bottom: 1px solid #21262d; }
th { color: #8b949e; font-weight: 500; }
td .n { color: #8b949e; font-size: 11px; }
.asset-recent { margin-bottom: 10px; }
.asset-name { font-weight: 600; color: #58a6ff; margin-bottom: 4px; font-size: 13px; }
.rounds { display: flex; gap: 4px; flex-wrap: wrap; }
.round { display: inline-block; width: 22px; height: 22px; border-radius: 4px; text-align: center; line-height: 22px; font-size: 11px; font-weight: 700; }
.round.win { background: #033a16; color: #3fb950; }
.round.loss { background: #4a0d10; color: #f85149; }
</style>
</head>
<body>
<h1>Closing Gap</h1>
<div id="countdown">—</div>

<h2>Live calls (final 4 min) <span id="freshness"></span></h2>
<div id="live-content"><div class="muted">Waiting for window…</div></div>

<h2>Track record</h2>
<div id="asset-toggle">
  <button data-asset="all" class="active">All</button>
  <button data-asset="BTC">BTC</button>
  <button data-asset="ETH">ETH</button>
  <button data-asset="SOL">SOL</button>
  <button data-asset="XRP">XRP</button>
  <button data-asset="DOGE">DOGE</button>
</div>
<div id="track-content"><div class="muted">Loading…</div></div>

<h2>Last 10 rounds</h2>
<div id="recent-content"><div class="muted">Loading…</div></div>

<script>
const REPO = 'rebuilt32-bit/btc-signal';
const BACKTEST_URL = `https://api.github.com/repos/${REPO}/contents/data/closing_gap_analysis.json?ref=main`;
const LIVE_GAP_URL = '/data/closing_gap_live.json';
let backtest = null, liveCalls = [], liveSnapTime = null, selectedAsset = 'all', lastBacktestFetch = 0;

async function fetchJson(url) {
  const isGithub = url.includes('api.github.com');
  const sep = url.includes('?') ? '&' : '?';
  const headers = isGithub ? { 'Accept': 'application/vnd.github.v3.raw' } : {};
  const r = await fetch(url + sep + 't=' + Date.now(), { headers });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}

function inFinalWindow() {
  const m = new Date().getMinutes();
  return (m >= 12 && m < 15) || (m >= 27 && m < 30) || (m >= 42 && m < 45) || (m >= 57 && m < 60);
}

function nextStartMs() {
  const now = new Date(), m = now.getMinutes();
  const targets = [11, 26, 41, 56];
  const next = targets.find(t => t > m);
  let target;
  if (next !== undefined) target = new Date(now.getFullYear(), now.getMonth(), now.getDate(), now.getHours(), next, 0);
  else target = new Date(now.getFullYear(), now.getMonth(), now.getDate(), now.getHours() + 1, 12, 0);
  return target - now;
}

function nextCloseMs() {
  const now = new Date(), m = now.getMinutes();
  let target;
  if (m < 15) target = new Date(now.getFullYear(), now.getMonth(), now.getDate(), now.getHours(), 15, 0);
  else if (m < 30) target = new Date(now.getFullYear(), now.getMonth(), now.getDate(), now.getHours(), 30, 0);
  else if (m < 45) target = new Date(now.getFullYear(), now.getMonth(), now.getDate(), now.getHours(), 45, 0);
  else target = new Date(now.getFullYear(), now.getMonth(), now.getDate(), now.getHours() + 1, 0, 0);
  return target - now;
}

function fmtDur(ms) {
  if (ms < 0) ms = 0;
  const total = Math.floor(ms / 1000);
  return `${Math.floor(total / 60)}m ${(total % 60).toString().padStart(2, '0')}s`;
}

function updateCountdown() {
  const cd = document.getElementById('countdown');
  if (inFinalWindow()) {
    cd.textContent = `IN WINDOW — closes in ${fmtDur(nextCloseMs())}`;
    cd.className = 'in-window';
  } else {
    cd.textContent = `Next final-4-min window in ${fmtDur(nextStartMs())}`;
    cd.className = '';
  }
}

function renderLive() {
  const el = document.getElementById('live-content');
  if (!liveCalls.length) { el.innerHTML = '<div class="muted">No active calls</div>'; return; }
  el.innerHTML = liveCalls.map(c => {
    const yesBid = c.market_yes_bid || '—';
    const yesAsk = c.market_yes_ask || '—';
    const noBid = c.market_yes_ask ? (1 - parseFloat(c.market_yes_ask)).toFixed(4) : '—';
    const noAsk = c.market_yes_bid ? (1 - parseFloat(c.market_yes_bid)).toFixed(4) : '—';
    const marginStr = c.margin_ratio === 'infinite' ? '∞' : c.margin_ratio + 'x';
    const sideText = c.safe_side === 'YES' ? `YES ${yesBid}/${yesAsk}` :
                     c.safe_side === 'NO'  ? `NO ${noBid}/${noAsk}` : 'at strike';
    return `<div class="call ${c.bucket}">
      <div class="call-header">
        <span class="asset">${c.asset}</span>
        <span class="bucket-tag">${c.bucket}</span>
        <span class="time-left" data-close="${c.close_time}">${fmtDur(c.seconds_left * 1000)} left</span>
      </div>
      <div class="call-body">
        <span>price $${c.current_price.toFixed(2)}</span>
        <span>strike $${c.strike.toFixed(2)}</span>
        <span>gap $${c.gap.toFixed(2)} (${c.safe_side || 'AT'})</span>
        <span>margin ${marginStr}</span>
      </div>
      <div class="call-prices">${sideText}</div>
    </div>`;
  }).join('');
}

function updateFreshness() {
  const el = document.getElementById('freshness');
  if (!liveSnapTime) { el.textContent = ''; return; }
  const age = (Date.now() - new Date(liveSnapTime).getTime()) / 1000;
  let cls = 'fresh';
  if (age > 30) cls = 'old';
  else if (age > 10) cls = 'stale';
  else if (age > 5) cls = 'aging';
  el.textContent = `${Math.round(age)}s old`;
  el.className = `freshness ${cls}`;
}

function renderTrack() {
  const el = document.getElementById('track-content');
  if (!backtest) { el.innerHTML = '<div class="muted">Loading…</div>'; return; }
  let data;
  if (selectedAsset === 'all') data = backtest.by_bucket_x_checkpoint;
  else if (backtest.by_asset && backtest.by_asset[selectedAsset]) data = backtest.by_asset[selectedAsset].by_bucket_x_checkpoint;
  else { el.innerHTML = `<div class="muted">No data for ${selectedAsset} yet (waiting for next GitHub Actions run)</div>`; return; }
  if (!data || !Object.keys(data).length) { el.innerHTML = '<div class="muted">No data</div>'; return; }
  const buckets = ['extreme', 'exceptional', 'very_high', 'high', 'moderate', 'narrow', 'coinflip', 'losing_side'];
  const cps = ['3min_left', '2min_left', '1min_left'];
  let html = '<table><thead><tr><th>bucket</th>';
  cps.forEach(cp => html += `<th>${cp.replace('_left', '')}</th>`);
  html += '</tr></thead><tbody>';
  let anyRow = false;
  buckets.forEach(b => {
    const row = data[b];
    if (!row) return;
    const rowHasData = cps.some(cp => row[cp] && row[cp].n > 0);
    if (!rowHasData) return;
    anyRow = true;
    html += `<tr><td>${b}</td>`;
    cps.forEach(cp => {
      const cell = row[cp];
      if (cell && cell.n > 0) {
        const rate = (cell.win_rate * 100).toFixed(1);
        html += `<td>${rate}% <span class="n">(${cell.n})</span></td>`;
      } else html += '<td>—</td>';
    });
    html += '</tr>';
  });
  html += '</tbody></table>';
  el.innerHTML = anyRow ? html : '<div class="muted">No data</div>';
}

function renderRecent() {
  const el = document.getElementById('recent-content');
  if (!backtest || !backtest.recent_outcomes) { el.innerHTML = '<div class="muted">Waiting for next GitHub Actions run…</div>'; return; }
  const rec = backtest.recent_outcomes;
  if (selectedAsset !== 'all') {
    const rounds = rec[selectedAsset] || [];
    if (!rounds.length) { el.innerHTML = `<div class="muted">No outcomes for ${selectedAsset}</div>`; return; }
    el.innerHTML = `<div class="asset-recent"><div class="rounds">${rounds.map(r => 
      `<span class="round ${r.won ? 'win' : 'loss'}" title="${r.bucket} @ ${r.checkpoint}">${r.won ? 'W' : 'L'}</span>`
    ).join('')}</div></div>`;
  } else {
    const assets = ['BTC', 'ETH', 'SOL', 'XRP', 'DOGE'];
    let html = '';
    assets.forEach(a => {
      const rounds = rec[a] || [];
      if (!rounds.length) return;
      html += `<div class="asset-recent"><div class="asset-name">${a}</div><div class="rounds">${
        rounds.map(r => `<span class="round ${r.won ? 'win' : 'loss'}" title="${r.bucket} @ ${r.checkpoint}">${r.won ? 'W' : 'L'}</span>`).join('')
      }</div></div>`;
    });
    el.innerHTML = html || '<div class="muted">No outcomes yet</div>';
  }
}

async function loadData() {
  try {
    const live = await fetchJson(LIVE_GAP_URL);
    liveCalls = live.live_calls || [];
    liveSnapTime = live.generated_at;
    renderLive();
    updateFreshness();
  } catch (e) { console.error(e); document.title = "ERR: " + e.message; }
  if (Date.now() - lastBacktestFetch > 60000) {
    lastBacktestFetch = Date.now();
    try {
      const bt = await fetchJson(BACKTEST_URL);
      backtest = bt.backtest;
      renderTrack();
      renderRecent();
    } catch (e) { console.error(e); document.title = "ERR: " + e.message; }
  }
}

document.querySelectorAll('#asset-toggle button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#asset-toggle button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    selectedAsset = btn.dataset.asset;
    renderTrack();
    renderRecent();
  });
});

setInterval(() => {
  document.querySelectorAll('.time-left[data-close]').forEach(el => {
    const ms = new Date(el.dataset.close) - new Date();
    el.textContent = fmtDur(ms < 0 ? 0 : ms) + ' left';
  });
}, 1000);
setInterval(updateCountdown, 1000);
setInterval(updateFreshness, 1000);
setInterval(loadData, 5000);
updateCountdown();
loadData();
</script>
</body>
</html>
